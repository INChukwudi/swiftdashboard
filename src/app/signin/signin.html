<div class="login-pagebg app-blank bgi-size-cover bgi-position-center bgi-no-repeat" style="height: 100vh;">
  <div class="d-flex flex-column flex-root" id="kt_app_root">
    <div class="d-flex flex-column flex-center flex-column-fluid">
      <div class="d-flex flex-column flex-center text-center p-10">
        <div class="card card-flush w-lg-600px py-5">
          <div class="card-body py-15 py-lg-20">

            <div class="mb-14">
              <a href="#">
                <img alt="Logo" src="assets/swiftlogo1.png" class="h-60px" />
              </a>
            </div>

            <h1 class="fw-bolder text-gray-900 mb-5">Sign In</h1>
            <div class="fs-6 fw-semibold text-gray-500 mb-10">
              Enter your Credentials to Access your Account
            </div>

            <!-- Error Alert -->
            <div *ngIf="errorMessage" class="alert alert-danger d-flex align-items-center p-5 mb-10">
              <i class="ki-duotone ki-shield-cross fs-2hx text-danger me-4">
                <span class="path1"></span>
                <span class="path2"></span>
                <span class="path3"></span>
              </i>
              <div class="d-flex flex-column">
                <span>{{ errorMessage }}</span>
              </div>
            </div>

            <form class="form w-100" (ngSubmit)="onSignInClick()" #loginForm="ngForm">
              <!-- Hidden role input -->
              <input type="hidden" name="user_role" [(ngModel)]="selectedRole" />

              <div class="fv-row mb-8">
                <input
                  type="email"
                  placeholder="Email Address"
                  [(ngModel)]="email"
                  name="email"
                  required
                  autocomplete="off"
                  class="form-control bg-transparent"
                  [disabled]="isLoading"
                />
              </div>

              <div class="fv-row mb-3">
                <div class="position-relative mb-3">
                  <input
                    type="password"
                    placeholder="Password"
                    [(ngModel)]="password"
                    name="password"
                    required
                    autocomplete="off"
                    class="form-control bg-transparent"
                    id="password"
                    [disabled]="isLoading"
                  />
                  <span class="btn btn-sm btn-icon position-absolute translate-middle top-50 end-0 me-n2"
                        (click)="togglePassword()">
                    <i class="ki-duotone ki-eye-slash fs-2" id="eyeIcon">
                      <span class="path1"></span>
                      <span class="path2"></span>
                      <span class="path3"></span>
                      <span class="path4"></span>
                    </i>
                  </span>
                </div>
              </div>

              <div class="d-flex flex-stack flex-wrap gap-3 fs-base fw-semibold mb-8">
                <div></div>
                <a routerLink="/forgot-password" class="link-primary">Forgot Password?</a>
              </div>

              <div class="d-grid mb-10">
                <button
                  type="submit"
                  class="btn btn-primary"
                  [disabled]="isLoading || !email || !password">
                  <span class="text-white indicator-label" *ngIf="!isLoading">Sign In</span>
                  <span class="indicator-progress" *ngIf="isLoading">
                    Please wait...
                    <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                  </span>
                </button>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ============================================ -->
<!-- ROLE SELECTION MODAL -->
<!-- ============================================ -->
<div class="modal fade" [class.show]="showRoleModal" [style.display]="showRoleModal ? 'block' : 'none'" 
     tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered mw-400px">
    <div class="modal-content">
      <!-- Modal Header -->
      <div class="modal-header pb-0 border-0 justify-content-end">
        <div class="btn btn-sm btn-icon btn-active-color-primary" (click)="closeRoleModal()">
          <i class="ki-duotone ki-cross fs-1">
            <span class="path1"></span>
            <span class="path2"></span>
          </i>
        </div>
      </div>

      <!-- Modal Body -->
      <div class="modal-body scroll-y mx-5 mx-xl-18 pt-0 pb-15 text-center">
        <!-- Icon -->
        <div class="mb-8">
          <i class="ki-duotone ki-security-user fs-5x text-primary">
            <span class="path1"></span>
            <span class="path2"></span>
          </i>
        </div>

        <h1 class="mb-3">Select Role</h1>
        <div class="text-muted fw-semibold fs-5 mb-10">Please confirm your access level</div>

        <!-- Role Options -->
        <div class="d-flex flex-column gap-5">
          <!-- Admin Option -->
          <button type="button" 
                  class="btn btn-light-primary btn-lg w-100 py-6 role-option"
                  (click)="selectRole('admin')">
            <div class="d-flex flex-column align-items-center">
              <i class="ki-duotone ki-shield-search fs-2hx mb-3 text-primary">
                <span class="path1"></span>
                <span class="path2"></span>
                <span class="path3"></span>
              </i>
              <span class="fw-bold fs-4">Sign in as Admin</span>
              <span class="text-gray-800 fs-7 mt-1">Access admin dashboard  </span>
            </div>
          </button>

          <!-- Employee Option -->
          <button type="button" 
                  class="btn btn-light-info btn-lg w-100 py-6 role-option"
                  (click)="selectRole('employee')">
            <div class="d-flex flex-column align-items-center">
              <i class="ki-duotone ki-profile-user fs-2hx mb-3 text-info">
                <span class="path1"></span>
                <span class="path2"></span>
                <span class="path3"></span>
                <span class="path4"></span>
              </i>
              <span class="fw-bold fs-4">Sign in as Employee</span>
              <span class="text-gray-800 fs-7 mt-1">Access employee dashboard</span>
            </div>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal Backdrop -->
<div class="modal-backdrop fade show" *ngIf="showRoleModal" (click)="closeRoleModal()"></div>

<style>
  .modal.show {
    display: block !important;
  }

  .role-option {
    transition: all 0.2s ease;
    border: 2px solid transparent;
  }

  .role-option:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
  }

  .btn-light-primary.role-option:hover {
    border-color: #009ef7;
    background-color: #f1faff;
  }

  .btn-light-info.role-option:hover {
    border-color: #7239ea;
    background-color: #f8f5ff;
  }

  .role-option:active {
    transform: translateY(0);
  }
</style>
